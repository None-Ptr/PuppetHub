# 分发定稿（V2 阶段 1）：版本真源 = PyPI，`pip install puppethub` 承担依赖解析——
# 自动拉 openpuppet-language（其 wheel 按 data-files 带 spec/ + conformance/，见语言仓
# pyproject）与钉死的 flet。启动时 compat 校验版本**与数据文件**，残缺安装当场可见。
# 否决过：zip / 仓库直装（spec/ 会漂移出第二份）、安装包（打包流水线坑）。
[project]
name = "puppethub"
# 0.3.0：规划层（```plan``` 块，步骤完成由**机制按判据核验**）· 技能组改"总纲常驻 +
# 专项按需"（省 token 43.8%）· 自主主体性四件（交棒打锚 / 事后评价采证 / 经验固化）
# · 感知层 watch 看门狗 · 0.2.0 已发 PyPI（首页 + 调度官 + 凭据落环境变量）。
version = "0.3.0"
description = "OpenPuppet 的搭建与运行软件：让 LLM 孕育并驱动应用；裸跑即首页——多 app 协作与调度官。"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "None-Ptr" }]
keywords = ["agent", "llm", "gui", "flet", "app-builder", "multi-agent", "orchestrator"]
# 3.11 起才有 stdlib 的 tomllib——`puppethub.toml` 的解析用它（不引第三方依赖）。
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    # 语言标准实现（规范 + conformance + 参考实现）。
    # 范围收窄到 2.1：真源写回（序列化器）与 dialog 节点都在 2.1 落地，V1 主路径依赖前者。
    # 语言继续出修订时同一 app 的行为可能不同而人看不出来，故宁可拒绝启动。
    # 下限 2.1.1：submit 载荷修复（移动键盘"完成键"）+ 用例 118；puppethub 的
    # builder 产物依赖它。
    "openpuppet-language>=2.1.1,<2.2",
    # 渲染**绑定** flet——它不是可插拔槽位，是产品的一部分。
    # 钉死版本：0.86 与 1.0 的 API 差异极大（字段改名、Signatures 变 kwargs）。
    "flet==0.86.5",
]

[project.scripts]
puppethub = "puppethub.cli:main"

[build-system]
# **>=77 不是随手写的**：`license = "MIT"`（PEP 639 的 SPDX 表达式）+ `license-files`
# 需要 setuptools 77+ 才认识；地板低了，隔离构建会装出旧 setuptools 然后
# InvalidConfigError——而那时报错的人是从 sdist 装的用户，不是本机。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["puppethub*"]

# 包内数据文件：内置技能（builtin_skills/*.md）随 wheel 走——skill 是 .md 文件
# 而不是代码，"放文件即生效"的另一半是"随包分发也要真的把文件带上"。
[tool.setuptools.package-data]
puppethub = ["builtin_skills/*.md"]
